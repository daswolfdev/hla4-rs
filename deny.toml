# cargo-deny configuration.
#
# Supply-chain hardening for the hla4-rs workspace. Run with:
#   cargo deny check
#
# This is one of the mission-critical artifacts every production Rust crate
# needs: vulnerability gates, license enforcement, and a banned-crates list.
# A passing `cargo deny check` is a precondition for any release tag.

[graph]
# Restrict to targets we actually ship for. Cuts platform-specific noise.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Fail the build on any unmaintained or insecure crate. Yanked crates are
# tolerated only briefly while we cut a fixed release.
yanked = "deny"
ignore = []

[licenses]
# Whitelist of permissive and weak-copyleft licenses our supply chain is
# allowed to introduce. Anything outside this list fails the build — a
# safe default for mission-critical work where a strong-copyleft transitive
# dependency would be a release blocker.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.92

[bans]
# Disallow multiple major versions of the same crate without explicit
# justification — cuts attack surface and binary size.
multiple-versions = "warn"
wildcards = "deny"
# Crates we never want pulled in via any path. Add entries with a reason.
deny = [
    # Example shape; populate after a `cargo tree` audit:
    # { name = "openssl", reason = "use rustls instead — rustls is audited and pure-Rust" },
]

[sources]
# Pin allowed registries / git sources. Locks down where dependencies may
# come from — defense in depth against a typosquatting or registry takeover.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
